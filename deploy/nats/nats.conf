server_name: porfirium-target
port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_file_store: 2GB
  max_memory_store: 128MB
}

max_payload: 1MB
write_deadline: "10s"

authorization {
  users: [
    {
      user: bootstrap
      password: $NATS_BOOTSTRAP_PASSWORD
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
    {
      user: conversation_service
      password: $NATS_CONVERSATION_PASSWORD
      permissions: {
        publish: [
          "$JS.API.>"
          "$JS.ACK.>"
          "porfirium.run.command.requested"
          "porfirium.conversation.event.*"
          "porfirium.input.command.*"
          "porfirium.audit.event.*"
        ]
        subscribe: [
          "_INBOX.>"
          "porfirium.message.delta.*"
          "porfirium.run.event.*"
        ]
      }
    }
    {
      user: agent_runner
      password: $NATS_RUNNER_PASSWORD
      permissions: {
        publish: [
          "$JS.API.>"
          "$JS.ACK.>"
          "porfirium.run.command.*"
          "porfirium.run.event.*"
          "porfirium.audit.event.*"
        ]
        subscribe: [
          "_INBOX.>"
          "porfirium.run.command.*"
          "porfirium.conversation.event.*"
          "porfirium.run.event.*"
        ]
      }
    }
    {
      user: agent_runtime_api
      password: $NATS_RUNTIME_PASSWORD
      permissions: {
        publish: [
          "$JS.API.>"
          "$JS.ACK.>"
          "porfirium.message.delta.*"
          "porfirium.run.event.*"
          "porfirium.conversation.event.*"
          "porfirium.audit.event.*"
        ]
        subscribe: [
          "_INBOX.>"
          "porfirium.input.command.*"
          "porfirium.run.command.*"
        ]
      }
    }
    {
      user: checkpoint_api
      password: $NATS_CHECKPOINT_PASSWORD
      permissions: {
        publish: [
          "$JS.API.>"
          "$JS.ACK.>"
          "porfirium.run.event.*"
          "porfirium.audit.event.*"
        ]
        subscribe: []
      }
    }
    {
      user: agent_registry
      password: $NATS_REGISTRY_PASSWORD
      permissions: {
        publish: "porfirium.audit.event.*"
        subscribe: []
      }
    }
    {
      user: identity_delegation
      password: $NATS_DELEGATION_PASSWORD
      permissions: {
        publish: "porfirium.audit.event.*"
        subscribe: []
      }
    }
    {
      user: configuration_service
      password: $NATS_CONFIGURATION_PASSWORD
      permissions: {
        publish: "porfirium.audit.event.*"
        subscribe: []
      }
    }
  ]
}
