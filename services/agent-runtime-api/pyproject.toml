[project]
name = "porfirium-agent-runtime-api"
version = "0.1.0"
description = "Agent Runtime API service"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "nats-py==2.15.0",
  "uvicorn==0.35.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime_api"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
