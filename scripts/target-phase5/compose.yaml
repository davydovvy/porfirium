services:
  phase5-harness:
    profiles: [target]
    build:
      context: ../..
      dockerfile: scripts/target-phase5/Dockerfile
    environment:
      RUNTIME_ENDPOINT: agent-runtime-api:50051
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
