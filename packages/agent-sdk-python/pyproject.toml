[project]
name = "porfirium-agent-sdk"
version = "0.2.0"
description = "Porfirium Python Agent SDK"
requires-python = ">=3.12"
dependencies = ["grpcio==1.74.0", "httpx==0.28.1", "protobuf==7.35.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["porfirium_agent_sdk"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0", "ruff==0.12.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["porfirium_agent_sdk/proto/runtime_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
