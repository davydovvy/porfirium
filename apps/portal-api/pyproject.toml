[project]
name = "genai-portal-api"
version = "0.1.0"
description = "Authenticated portal API for Porfirium"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "langfuse>=3.3.1,<5",
  "pyjwt[crypto]==2.10.1",
  "sqlalchemy[asyncio]==2.0.43",
  "temporalio==1.30.0",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portal_api"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
